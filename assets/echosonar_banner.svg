<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030D12" />
      <stop offset="55%" stop-color="#071F1B" />
      <stop offset="100%" stop-color="#041118" />
    </linearGradient>
    <radialGradient id="sweepGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.35" />
      <stop offset="65%" stop-color="#00E676" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00E676" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="1197" height="317" rx="21" fill="none" stroke="#134E4A" stroke-width="2" />

  <!-- Subtle Grid Lines -->
  <g stroke="#0F2E28" stroke-width="1" opacity="0.7">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
  </g>

  <!-- Radar Graphic on Left -->
  <g transform="translate(180, 160)">
    <circle cx="0" cy="0" r="120" fill="url(#sweepGlow)" />
    <circle cx="0" cy="0" r="105" fill="none" stroke="#00E676" stroke-width="2" opacity="0.65" />
    <circle cx="0" cy="0" r="74" fill="none" stroke="#00E676" stroke-width="1.4" stroke-dasharray="6,6" opacity="0.55" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#00E5FF" stroke-width="1.4" opacity="0.6" />
    <line x1="-105" y1="0" x2="105" y2="0" stroke="#00E676" stroke-width="1" opacity="0.35" />
    <line x1="0" y1="-105" x2="0" y2="105" stroke="#00E676" stroke-width="1" opacity="0.35" />
    <path d="M 0 0 L 0 -105 A 105 105 0 0 1 88 -56 Z" fill="#00E5FF" opacity="0.18" />
    <line x1="0" y1="0" x2="80" y2="-65" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
    <!-- Target Blips -->
    <circle cx="56" cy="-46" r="12" fill="#00E5FF" opacity="0.25" />
    <circle cx="56" cy="-46" r="5" fill="#00E676" />
    <circle cx="-48" cy="-36" r="4" fill="#64B5F6" opacity="0.7" />
    <circle cx="0" cy="0" r="5.5" fill="#00E5FF" />
    <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
  </g>

  <!-- Title & Subtitle -->
  <text x="345" y="128" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="60" font-weight="800" fill="#FFFFFF" letter-spacing="1">
    Echo<tspan fill="url(#accentText)">Sonar</tspan>
  </text>
  <text x="347" y="170" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="22" font-weight="600" fill="#A7F3D0">
    Ultrasonic Active Radar • 18.5–20.5 kHz FMCW DSP &amp; Micro-Doppler
  </text>
  <text x="347" y="210" font-family="Consolas, monospace" font-size="16" fill="#7DD3FC">
    Butterworth 4th-Order IIR • I/Q Envelope Correlation • Live A-Scan • Passive RF Context
  </text>

  <!-- Mini A-Scan Waveform -->
  <g transform="translate(347, 236)">
    <rect x="0" y="0" width="520" height="44" rx="8" fill="#030A07" stroke="#1B5E20" stroke-width="1" />
    <rect x="18" y="28" width="12" height="10" rx="2" fill="#00E676" opacity="0.6" />
    <rect x="38" y="24" width="12" height="14" rx="2" fill="#00E676" opacity="0.7" />
    <rect x="58" y="30" width="12" height="8" rx="2" fill="#00E676" opacity="0.5" />
    <rect x="78" y="18" width="12" height="20" rx="2" fill="#00E5FF" opacity="0.8" />
    <rect x="98" y="26" width="12" height="12" rx="2" fill="#00E676" opacity="0.6" />
    <rect x="118" y="31" width="12" height="7" rx="2" fill="#00E676" opacity="0.5" />
    <rect x="138" y="8" width="12" height="30" rx="2" fill="#FF5252" opacity="0.95" />
    <rect x="158" y="16" width="12" height="22" rx="2" fill="#00E5FF" opacity="0.85" />
    <rect x="178" y="27" width="12" height="11" rx="2" fill="#00E676" opacity="0.6" />
    <rect x="198" y="31" width="12" height="7" rx="2" fill="#00E676" opacity="0.5" />
    <rect x="218" y="29" width="12" height="9" rx="2" fill="#00E676" opacity="0.5" />
    <rect x="238" y="22" width="12" height="16" rx="2" fill="#00E5FF" opacity="0.75" />
    <rect x="258" y="30" width="12" height="8" rx="2" fill="#00E676" opacity="0.5" />
    <rect x="278" y="32" width="12" height="6" rx="2" fill="#00E676" opacity="0.4" />
    <text x="315" y="27" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#00E676">PURE KOTLIN DSP • ZERO ML BLOAT</text>
  </g>
</svg>
